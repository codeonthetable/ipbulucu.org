name: Publish reviewed Python SDK 1.1.0
on: workflow_dispatch
permissions: {}
jobs:
  publish:
    if: github.repository == 'codeonthetable/ipbulucu.org' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Retrieve and verify reviewed distributions
        run: |
          set -eu
          mkdir dist
          cd dist
          base=https://github.com/codeonthetable/ipbulucu.org/releases/download/python-sdk-v1.1.0
          for name in ipbulucu-1.1.0-py3-none-any.whl ipbulucu-1.1.0.tar.gz; do
            curl --fail --silent --show-error --location --proto '=https' "$base/$name" -o "$name"
          done
          sha256sum --check --strict <<'SUMS'
          d139c28bdf607c48b42bad9833d9ffa5867be9ade326f8f21b05dfd5dc4360df  ipbulucu-1.1.0-py3-none-any.whl
          b6e255fc0fc817c8741078c4c7cec71c6dba530d8ee479368a4f4750071a40a4  ipbulucu-1.1.0.tar.gz
          SUMS
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
