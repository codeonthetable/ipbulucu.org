name: Publish reviewed Python SDK 1.0.2
on: workflow_dispatch
permissions: {}
jobs:
  publish:
    if: github.repository == 'codeonthetable/ipbulucu.org' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Retrieve and verify reviewed distributions
        run: |
          set -eu
          mkdir dist
          cd dist
          base=https://github.com/codeonthetable/ipbulucu.org/releases/download/python-sdk-v1.0.2
          for name in ipbulucu-1.0.2-py3-none-any.whl ipbulucu-1.0.2.tar.gz; do
            curl --fail --silent --show-error --location --proto '=https' "$base/$name" -o "$name"
          done
          sha256sum --check --strict <<'SUMS'
          ed5af86fbf4a4b732dce534d9197075d2a681fd40577ec5ef4af6e9ec4e7601d  ipbulucu-1.0.2-py3-none-any.whl
          94b28ec0c0d3b747b25891c87951faad37461ca1c5bb152a442c16e086baf42e  ipbulucu-1.0.2.tar.gz
          SUMS
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
